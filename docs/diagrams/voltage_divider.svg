<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250">
  <rect width="760" height="250" rx="20" fill="#f8f9fc"/>
  <text x="380" y="36" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#1c1c1e" text-anchor="middle">5V to 3.3V Logic Level Voltage Divider (Critical Wiring)</text>
  <text x="380" y="56" font-family="-apple-system, sans-serif" font-size="12" fill="#6e6e73" text-anchor="middle">Protects NodeMCU D1 (3.3V GPIO) from Arduino UNO D7 (5V TX) logic high</text>
  <rect x="40" y="85" width="170" height="120" rx="14" fill="#007aff"/>
  <text x="125" y="135" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Arduino UNO</text>
  <text x="125" y="156" font-family="-apple-system, sans-serif" font-size="12" fill="#e5f1ff" text-anchor="middle">D7 (TX - 5V Logic)</text>
  <text x="125" y="182" font-family="-apple-system, sans-serif" font-size="12" fill="#e5f1ff" text-anchor="middle">GND</text>
  <line x1="210" y1="145" x2="290" y2="145" stroke="#1c1c1e" stroke-width="2.5"/>
  <rect x="290" y="133" width="80" height="24" rx="6" fill="#ff9500"/>
  <text x="330" y="149" font-family="monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">R1: 1 kΩ</text>
  <line x1="370" y1="145" x2="540" y2="145" stroke="#34c759" stroke-width="2.5"/>
  <circle cx="430" cy="145" r="5" fill="#34c759"/>
  <text x="430" y="128" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#248a3d" text-anchor="middle">~3.44V Safe</text>
  <line x1="430" y1="145" x2="430" y2="165" stroke="#1c1c1e" stroke-width="2"/>
  <rect x="390" y="165" width="80" height="24" rx="6" fill="#5856d6"/>
  <text x="430" y="181" font-family="monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">R2: 2.2 kΩ</text>
  <line x1="430" y1="189" x2="430" y2="215" stroke="#1c1c1e" stroke-width="2"/>
  <line x1="210" y1="182" x2="250" y2="182" stroke="#1c1c1e" stroke-width="2"/>
  <line x1="250" y1="182" x2="250" y2="215" stroke="#1c1c1e" stroke-width="2"/>
  <line x1="250" y1="215" x2="510" y2="215" stroke="#1c1c1e" stroke-width="2.5"/>
  <line x1="510" y1="215" x2="510" y2="182" stroke="#1c1c1e" stroke-width="2"/>
  <line x1="510" y1="182" x2="540" y2="182" stroke="#1c1c1e" stroke-width="2"/>
  <text x="380" y="233" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="middle">Common Ground Bus (GND)</text>
  <rect x="540" y="85" width="180" height="120" rx="14" fill="#34c759"/>
  <text x="630" y="135" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">NodeMCU ESP8266</text>
  <text x="630" y="156" font-family="-apple-system, sans-serif" font-size="12" fill="#e8faed" text-anchor="middle">D1 (RX - 3.3V Safe)</text>
  <text x="630" y="182" font-family="-apple-system, sans-serif" font-size="12" fill="#e8faed" text-anchor="middle">GND</text>
</svg>